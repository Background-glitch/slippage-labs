[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slippage-labs"
version = "0.1.1"
description = "Honest liquidity & slippage analytics for prediction markets"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "slippage-labs contributors" }]
keywords = ["polymarket", "kalshi", "prediction-markets", "slippage", "liquidity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.30",
]

[project.scripts]
slippage-labs = "slippage_labs.cli:app"

[project.urls]
Homepage = "https://github.com/Background-glitch/slippage-labs"
Issues = "https://github.com/Background-glitch/slippage-labs/issues"

[tool.hatch.build.targets.wheel]
packages = ["slippage_labs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
