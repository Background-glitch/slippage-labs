name: Publish to PyPI

# Triggers on a `vX.Y.Z` tag push only. Uses PyPI's Trusted Publisher (OIDC)
# instead of an API token — no secrets stored in this repo. Before this works:
#   1. Create the project on PyPI (one-time): https://pypi.org/manage/account/publishing/
#   2. Add a "trusted publisher" with: owner=<your-gh-user>, repo=slippage-labs,
#      workflow=publish.yml, environment=pypi
#   3. Push a `v0.1.0` tag from main: `git tag v0.1.0 && git push origin v0.1.0`

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Upload artifacts for publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # GitHub Environment scoping for the OIDC trust
    permissions:
      id-token: write          # required for Trusted Publishers
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
